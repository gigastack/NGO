<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-label="The Monolith and the Margin: Zuma Rock and Abuja Civic Horizon">
  <defs>
    <!-- Sky & Atmosphere Gradients -->
    <linearGradient id="m-sky-grad" x1="600" y1="0" x2="600" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7A3918" />
      <stop offset="25%" stop-color="#B85D36" />
      <stop offset="55%" stop-color="#D49B35" />
      <stop offset="82%" stop-color="#F2DFBC" />
      <stop offset="100%" stop-color="#FAF8F5" />
    </linearGradient>

    <radialGradient id="m-sun-grad" cx="600" cy="380" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F5" stop-opacity="1" />
      <stop offset="25%" stop-color="#FCEAB8" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#D49B35" stop-opacity="0.45" />
      <stop offset="85%" stop-color="#B85D36" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#B85D36" stop-opacity="0" />
    </radialGradient>

    <!-- Mountain & Monolith Gradients -->
    <linearGradient id="m-zuma-core" x1="450" y1="180" x2="750" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D2825" />
      <stop offset="40%" stop-color="#1B1A19" />
      <stop offset="85%" stop-color="#111113" />
      <stop offset="100%" stop-color="#0B0B0C" />
    </linearGradient>

    <linearGradient id="m-zuma-highlight" x1="580" y1="190" x2="820" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2CE78" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#D49B35" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#B85D36" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#4A2010" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="m-distant-ridge" x1="0" y1="360" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8C4E2E" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#A8623B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#6F361B" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="m-savannah-mid" x1="0" y1="450" x2="0" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D4D41" />
      <stop offset="35%" stop-color="#1C3F35" />
      <stop offset="75%" stop-color="#152F28" />
      <stop offset="100%" stop-color="#0E1E1A" />
    </linearGradient>

    <linearGradient id="m-ground-fore" x1="0" y1="580" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B85D36" />
      <stop offset="30%" stop-color="#8B3D1B" />
      <stop offset="70%" stop-color="#421D10" />
      <stop offset="100%" stop-color="#111113" />
    </linearGradient>

    <filter id="m-soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- ==================== SKY & ATMOSPHERE ==================== -->
  <rect width="1200" height="800" fill="url(#m-sky-grad)" />

  <!-- Radiating Golden Dawn Rays -->
  <g opacity="0.25">
    <polygon points="600,380 0,0 80,0" fill="#FAF8F5" />
    <polygon points="600,380 220,0 340,0" fill="#FAF8F5" />
    <polygon points="600,380 480,0 600,0" fill="#FAF8F5" />
    <polygon points="600,380 720,0 860,0" fill="#FAF8F5" />
    <polygon points="600,380 980,0 1120,0" fill="#FAF8F5" />
    <polygon points="600,380 1200,40 1200,160" fill="#FAF8F5" />
    <polygon points="600,380 0,60 0,180" fill="#FAF8F5" />
  </g>

  <!-- Golden Sun Core -->
  <circle cx="600" cy="380" r="280" fill="url(#m-sun-grad)" />
  <circle cx="600" cy="380" r="90" fill="#FAF8F5" opacity="0.8" />
  <circle cx="600" cy="380" r="50" fill="#FAF8F5" />

  <!-- ==================== DISTANT HILLS & SAVANNAH RIDGES ==================== -->
  <!-- Far Misty Ridge -->
  <path d="M0 450 Q280 390 560 420 Q840 450 1200 400 L1200 540 L0 540 Z" fill="url(#m-distant-ridge)" />

  <!-- Mid-distance Foothill Ridge -->
  <path d="M0 480 Q180 440 380 460 Q600 480 820 445 Q1040 410 1200 460 L1200 600 L0 600 Z" fill="#42291E" opacity="0.85" />

  <!-- ==================== ZUMA ROCK / MONOLITH MAJESTY ==================== -->
  <!-- Base Silhouette of Zuma Inselberg -->
  <!-- Main Rock Mass -->
  <path d="M380 520 C395 360, 420 250, 470 210 C505 180, 560 170, 630 170 C710 170, 770 185, 805 220 C845 260, 860 360, 875 520 Z" fill="url(#m-zuma-core)" />

  <!-- Rock Face Striations & Ancient Texture Facets -->
  <!-- Shaded Western Face -->
  <path d="M380 520 C395 360, 420 250, 470 210 C505 180, 560 170, 610 172 C590 240, 580 340, 570 520 Z" fill="#111113" opacity="0.9" />

  <!-- Eastern Golden Hour Illuminated Face -->
  <path d="M608 172 C680 174, 760 188, 805 220 C845 260, 860 360, 875 520 L570 520 C580 340, 590 240, 608 172 Z" fill="url(#m-zuma-highlight)" />

  <!-- Deep Granite Vertical Fissures (Zuma Face Features) -->
  <path d="M490 230 Q485 360 475 520" stroke="#000000" stroke-width="4" opacity="0.8" />
  <path d="M530 205 Q535 340 525 520" stroke="#000000" stroke-width="5" opacity="0.85" />
  <path d="M570 185 Q568 330 565 520" stroke="#111113" stroke-width="6" opacity="0.9" />
  <path d="M620 185 Q625 330 635 520" stroke="#8B3D1B" stroke-width="4" opacity="0.8" />
  <path d="M680 200 Q690 340 705 520" stroke="#D49B35" stroke-width="3.5" opacity="0.75" />
  <path d="M740 220 Q755 350 780 520" stroke="#FAF8F5" stroke-width="2.5" opacity="0.7" />
  <path d="M800 255 Q815 370 835 520" stroke="#FAF8F5" stroke-width="2" opacity="0.5" />

  <!-- Rock Crown Golden Rim Highlight -->
  <path d="M470 210 C505 180, 560 170, 630 170 C710 170, 770 185, 805 220" stroke="#FAF8F5" stroke-width="4" fill="none" opacity="0.9" filter="url(#m-soft-blur)" />
  <path d="M470 210 C505 180, 560 170, 630 170 C710 170, 770 185, 805 220" stroke="#FCEAB8" stroke-width="2" fill="none" />

  <!-- ==================== SAVANNAH MIDGROUND & FORESTRY ==================== -->
  <path d="M0 520 C240 480, 480 540, 720 500 C960 460, 1100 510, 1200 495 L1200 680 L0 680 Z" fill="url(#m-savannah-mid)" />

  <!-- Acacia & Baobab Tree Silhouettes along Plateau -->
  <g fill="#111113">
    <!-- Left Tree Group -->
    <path d="M120 510 C120 480, 100 460, 70 450 C90 440, 140 435, 170 450 C190 460, 170 480, 170 510 L150 510 L150 530 L135 530 L135 510 Z" />
    <path d="M220 525 C220 500, 205 485, 185 475 C200 465, 235 460, 255 475 C270 485, 255 500, 255 525 L242 525 L242 542 L230 542 L230 525 Z" />

    <!-- Right Tree Group -->
    <path d="M980 515 C980 485, 960 465, 930 455 C950 445, 1000 440, 1030 455 C1050 465, 1030 485, 1030 515 L1010 515 L1010 535 L995 535 L995 515 Z" />
    <path d="M1090 510 C1090 475, 1065 450, 1030 440 C1055 430, 1120 425, 1155 440 C1180 450, 1155 475, 1155 510 L1130 510 L1130 535 L1110 535 L1110 510 Z" />
  </g>

  <!-- ==================== FOREGROUND: TERRACOTTA PLATEAU & CIVIC PATH ==================== -->
  <path d="M0 600 C300 580, 600 620, 900 580 C1050 560, 1140 590, 1200 575 L1200 800 L0 800 Z" fill="url(#m-ground-fore)" />

  <!-- Flowing Aquifer Stream / Water Reflection in Foreground -->
  <path d="M180 800 C280 720, 420 680, 520 650 C600 625, 680 640, 780 620 C850 605, 920 610, 980 595 L1020 610 C950 630, 870 630, 800 650 C690 680, 580 680, 480 720 C360 760, 240 780, 140 800 Z" fill="#1C3F35" opacity="0.8" />
  <path d="M220 800 C320 735, 450 700, 550 670 C630 645, 710 655, 800 638 L830 648 C740 668, 650 660, 570 685 C460 720, 340 750, 240 800 Z" fill="#D49B35" opacity="0.6" />
  <path d="M280 800 C370 750, 480 720, 580 690 L610 700 C500 730, 390 760, 300 800 Z" fill="#FAF8F5" opacity="0.75" />

  <!-- ==================== CIVIC SILHOUETTES: GRASSROOTS LEADERS & COMMUNITY ==================== -->
  <g fill="#111113">
    <!-- Community Figure 1: Standing Elder / Field Director (Left-center) -->
    <circle cx="480" cy="610" r="10" />
    <path d="M472 622 C465 635, 460 655, 455 690 L495 690 C493 655, 490 635, 484 622 Z" />
    <!-- Arm Gesturing toward the Monolith -->
    <path d="M484 630 L515 615 L522 622 L484 640 Z" fill="#D49B35" />

    <!-- Community Figure 2: Youth Leader with Tablet / Map (Center) -->
    <circle cx="530" cy="620" r="9" />
    <path d="M523 631 C518 642, 514 660, 510 690 L545 690 C542 660, 538 642, 533 631 Z" />
    <!-- Holding Glowing Tablet -->
    <polygon points="538,638 554,630 558,642 542,650" fill="#D49B35" />
    <circle cx="548" cy="636" r="3" fill="#FAF8F5" />

    <!-- Community Figure 3: Woman Advocate / Community Trustee (Right-center) -->
    <circle cx="575" cy="612" r="9.5" />
    <!-- Flowing Traditional Headwrap & Attire -->
    <path d="M565 605 C565 598, 585 598, 588 605 C592 612, 585 620, 575 622 C568 620, 565 612, 565 605 Z" fill="#B85D36" />
    <path d="M566 624 C558 640, 550 660, 545 690 L595 690 C592 660, 585 640, 580 624 Z" />

    <!-- Community Figure 4: Young Student with Notebook -->
    <circle cx="620" cy="635" r="8" />
    <path d="M613 645 C608 655, 605 670, 602 690 L635 690 C632 670, 628 655, 624 645 Z" />

    <!-- Additional Gathering Group (Right Foreground) -->
    <circle cx="680" cy="638" r="8.5" />
    <path d="M673 648 L668 690 L692 690 L687 648 Z" />

    <circle cx="710" cy="640" r="8" />
    <path d="M703 650 L698 690 L720 690 L716 650 Z" />

    <circle cx="740" cy="645" r="7.5" />
    <path d="M734 654 L730 690 L750 690 L746 654 Z" />
  </g>

  <!-- ==================== TYPOGRAPHIC OVERLAY BADGE / ACCENT ==================== -->
  <g transform="translate(60, 60)">
    <rect width="260" height="48" rx="4" fill="#111113" opacity="0.85" />
    <rect width="260" height="48" rx="4" fill="none" stroke="#D49B35" stroke-width="1.2" opacity="0.7" />
    <text x="18" y="24" font-family="system-ui, sans-serif" font-weight="800" font-size="11" letter-spacing="2.5" fill="#D49B35">ACT I: MONOLITH &amp; MARGIN</text>
    <text x="18" y="39" font-family="system-ui, sans-serif" font-weight="500" font-size="10" letter-spacing="1.2" fill="#FAF8F5">FCT Civic Horizon &amp; Ancestral Terrain</text>
  </g>
</svg>
