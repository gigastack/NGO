<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-label="Solar Code and Ancestral Clay: Youth STEM Learning and Pottery Craft in Kwali FCT">
  <defs>
    <!-- Background & Atmosphere Gradients -->
    <linearGradient id="y-sky-grad" x1="600" y1="0" x2="600" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111113" />
      <stop offset="35%" stop-color="#1F2825" />
      <stop offset="70%" stop-color="#B85D36" />
      <stop offset="90%" stop-color="#D49B35" />
      <stop offset="100%" stop-color="#FAF8F5" />
    </linearGradient>

    <linearGradient id="y-workshop-floor" x1="0" y1="480" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D49B35" />
      <stop offset="30%" stop-color="#B85D36" />
      <stop offset="70%" stop-color="#70321A" />
      <stop offset="100%" stop-color="#111113" />
    </linearGradient>

    <!-- Glowing Tech / Circuit Gradients -->
    <linearGradient id="y-circuit-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="50%" stop-color="#D49B35" />
      <stop offset="100%" stop-color="#1C3F35" />
    </linearGradient>

    <!-- Traditional Clay Pottery Gradients -->
    <linearGradient id="y-clay-pot-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D49B35" />
      <stop offset="40%" stop-color="#B85D36" />
      <stop offset="85%" stop-color="#6E2C14" />
      <stop offset="100%" stop-color="#2D1107" />
    </linearGradient>

    <linearGradient id="y-clay-pot-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="30%" stop-color="#C48052" />
      <stop offset="70%" stop-color="#8B3D1B" />
      <stop offset="100%" stop-color="#111113" />
    </linearGradient>

    <filter id="y-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== BACKGROUND & HORIZON ==================== -->
  <rect width="1200" height="800" fill="url(#y-sky-grad)" />

  <!-- Distant Kwali & Bwari Ridges through Workshop Openings -->
  <path d="M0 380 Q300 340 600 365 Q900 390 1200 350 L1200 480 L0 480 Z" fill="#1C3F35" opacity="0.8" />
  <path d="M0 420 Q240 380 480 400 Q720 420 960 395 Q1080 385 1200 410 L1200 500 L0 500 Z" fill="#152F28" />

  <!-- ==================== OPEN-AIR WORKSHOP TIMBER PERGOLA & SHADE CANOPY ==================== -->
  <g id="timber-pergola" stroke="#111113" stroke-linecap="round">
    <!-- Main Overhead Beams -->
    <line x1="60" y1="120" x2="1140" y2="120" stroke-width="12" />
    <line x1="120" y1="170" x2="1080" y2="170" stroke-width="8" stroke="#3D291E" />
    <line x1="80" y1="210" x2="1120" y2="210" stroke-width="6" stroke="#5C3E2E" />

    <!-- Supporting Timber Pillars (Vertical Columns) -->
    <line x1="160" y1="120" x2="160" y2="580" stroke-width="14" />
    <line x1="580" y1="120" x2="580" y2="520" stroke-width="14" />
    <line x1="1040" y1="120" x2="1040" y2="580" stroke-width="14" />

    <!-- Woven Raffia / Bamboo Slats (Shadow and Light Pattern) -->
    <g stroke="#D49B35" stroke-width="2" opacity="0.35">
      <line x1="180" y1="120" x2="180" y2="210" />
      <line x1="220" y1="120" x2="220" y2="210" />
      <line x1="260" y1="120" x2="260" y2="210" />
      <line x1="300" y1="120" x2="300" y2="210" />
      <line x1="340" y1="120" x2="340" y2="210" />
      <line x1="380" y1="120" x2="380" y2="210" />
      <line x1="420" y1="120" x2="420" y2="210" />
      <line x1="460" y1="120" x2="460" y2="210" />
      <line x1="500" y1="120" x2="500" y2="210" />
      <line x1="540" y1="120" x2="540" y2="210" />
      <line x1="620" y1="120" x2="620" y2="210" />
      <line x1="660" y1="120" x2="660" y2="210" />
      <line x1="700" y1="120" x2="700" y2="210" />
      <line x1="740" y1="120" x2="740" y2="210" />
      <line x1="780" y1="120" x2="780" y2="210" />
      <line x1="820" y1="120" x2="820" y2="210" />
      <line x1="860" y1="120" x2="860" y2="210" />
      <line x1="900" y1="120" x2="900" y2="210" />
      <line x1="940" y1="120" x2="940" y2="210" />
      <line x1="980" y1="120" x2="980" y2="210" />
      <line x1="1020" y1="120" x2="1020" y2="210" />
    </g>
  </g>

  <!-- ==================== WORKSHOP FLOOR: TERRACOTTA & GRANITE TILES ==================== -->
  <path d="M0 460 L1200 460 L1200 800 L0 800 Z" fill="url(#y-workshop-floor)" />

  <!-- Geometric Floor Slabs (Afro-Modern Ceramic Tilework) -->
  <g stroke="#111113" stroke-width="1.2" opacity="0.4">
    <line x1="0" y1="530" x2="1200" y2="530" />
    <line x1="0" y1="610" x2="1200" y2="610" />
    <line x1="0" y1="700" x2="1200" y2="700" />
    <line x1="200" y1="460" x2="100" y2="800" />
    <line x1="420" y1="460" x2="360" y2="800" />
    <line x1="640" y1="460" x2="620" y2="800" />
    <line x1="860" y1="460" x2="880" y2="800" />
    <line x1="1080" y1="460" x2="1140" y2="800" />
  </g>

  <!-- ==================== LEFT DOMAIN: LADI KWALI ANCESTRAL POTTERY ==================== -->
  <g id="ancestral-pottery-craft">
    <!-- Pedestal / Workbench -->
    <polygon points="120,620 340,620 360,720 100,720" fill="#1C3F35" stroke="#111113" stroke-width="3" />
    <line x1="110" y1="640" x2="350" y2="640" stroke="#D49B35" stroke-width="2" />

    <!-- Master Ceramic Urn 1: Large Traditional Water / Storage Vessel with Kwali Motifs -->
    <g transform="translate(180, 480)">
      <!-- Vessel Body -->
      <path d="M50 0 C10 0, -20 50, -20 90 C-20 135, 15 160, 50 160 C85 160, 120 135, 120 90 C120 50, 90 0, 50 0 Z" fill="url(#y-clay-pot-1)" stroke="#111113" stroke-width="3" />
      <!-- Rim Neck -->
      <ellipse cx="50" cy="0" rx="30" ry="8" fill="#D49B35" stroke="#111113" stroke-width="2.5" />
      <ellipse cx="50" cy="0" rx="20" ry="5" fill="#111113" />

      <!-- Ladi Kwali Stylized Animal & Reptile Incised Engravings (Sacred Geometry) -->
      <!-- Lizard / Crocodile Motif -->
      <path d="M50 40 Q40 55 50 70 Q60 85 50 100 Q40 115 50 130" stroke="#FAF8F5" stroke-width="2.2" fill="none" opacity="0.9" />
      <circle cx="48" cy="42" r="3" fill="#FAF8F5" />
      <circle cx="52" cy="42" r="3" fill="#FAF8F5" />
      <!-- Incised Chevrons & Wave Bands -->
      <path d="M0 80 Q50 95 100 80" stroke="#D49B35" stroke-width="2.5" fill="none" />
      <path d="M5 92 Q50 107 95 92" stroke="#FAF8F5" stroke-width="1.8" stroke-dasharray="3 3" fill="none" />
      <path d="M10 104 Q50 119 90 104" stroke="#D49B35" stroke-width="2.5" fill="none" />
    </g>

    <!-- Ceramic Urn 2: Slender Glazed Vase (Left Foreground) -->
    <g transform="translate(90, 560)">
      <path d="M30 0 C15 0, 0 30, 0 65 C0 100, 15 125, 30 125 C45 125, 60 100, 60 65 C60 30, 45 0, 30 0 Z" fill="url(#y-clay-pot-2)" stroke="#111113" stroke-width="2.5" />
      <ellipse cx="30" cy="0" rx="16" ry="5" fill="#FAF8F5" stroke="#111113" stroke-width="2" />
      <!-- Incised Spirals -->
      <path d="M10 50 Q30 65 50 50" stroke="#B85D36" stroke-width="2" fill="none" />
      <path d="M12 65 Q30 80 48 65" stroke="#FAF8F5" stroke-width="1.5" fill="none" />
    </g>
  </g>

  <!-- ==================== CENTER/RIGHT DOMAIN: SOLAR STEM CODE & DIGITAL CIRCUITS ==================== -->
  <g id="solar-stem-innovation">
    <!-- Modern Collaborative Worktable (Granite Top with Terracotta Legs) -->
    <polygon points="460,540 1080,540 1140,710 400,710" fill="#111113" stroke="#D49B35" stroke-width="3" />
    <line x1="410" y1="565" x2="1130" y2="565" stroke="#1C3F35" stroke-width="3.5" />

    <!-- Futuristic STEM Holographic Code Circuit Tree Radiating from Central Tablet -->
    <!-- Tablet / Laptop on Desk -->
    <g transform="translate(680, 500)">
      <!-- Laptop Screen (Open Facing Left/Center) -->
      <polygon points="0,0 90,-25 90,40 0,65" fill="#1C3F35" stroke="#FAF8F5" stroke-width="2" />
      <!-- Glowing Display Screen -->
      <polygon points="5,5 85,-18 85,35 5,58" fill="#111113" />

      <!-- Glowing Code Text Matrix on Screen -->
      <g fill="#D49B35" font-family="monospace" font-size="6" font-weight="bold">
        <text x="12" y="14">&gt; ARI.fct.init()</text>
        <text x="12" y="24">&gt; solar.sync(84kW)</text>
        <text x="12" y="34">&gt; deploy.water_mesh()</text>
        <text x="12" y="44" fill="#FAF8F5">&gt; CONNECTED: OK</text>
      </g>

      <!-- Keyboard Base -->
      <polygon points="0,65 90,40 130,70 40,95" fill="#2E2A27" stroke="#D49B35" stroke-width="1.5" />
    </g>

    <!-- Secondary Tablet with STEM Waveform (Right) -->
    <g transform="translate(860, 520)">
      <polygon points="0,0 80,0 90,50 10,50" fill="#111113" stroke="#FAF8F5" stroke-width="2" />
      <polygon points="5,5 75,5 85,45 15,45" fill="#1C3F35" />
      <!-- Oscilloscope / Sensor Waveform -->
      <path d="M18 25 Q35 5 45 25 T65 25 T80 25" stroke="#FAF8F5" stroke-width="2" fill="none" filter="url(#y-glow)" />
    </g>

    <!-- Radiating Glowing STEM Circuit Nodes (Connecting Clay Heritage to Solar Future) -->
    <g stroke="url(#y-circuit-glow)" stroke-linecap="round" filter="url(#y-glow)">
      <!-- Main Circuit Trunk -->
      <path d="M720 480 L720 340 L540 340 L540 280 L380 280" stroke-width="3" fill="none" />
      <path d="M720 340 L880 340 L880 260 L960 260" stroke-width="2.5" fill="none" />
      <path d="M540 340 L540 420 L420 420 L340 480" stroke-width="2.5" stroke-dasharray="6 4" fill="none" />

      <!-- Branching Micro-Lines -->
      <line x1="720" y1="400" x2="780" y2="400" stroke-width="1.8" />
      <line x1="780" y1="400" x2="810" y2="370" stroke-width="1.8" />
      <line x1="600" y1="340" x2="600" y2="290" stroke-width="1.8" />
      <line x1="480" y1="280" x2="480" y2="230" stroke-width="1.8" />
    </g>

    <!-- Glowing Circuit Nodes (Gold & Emerald Orbs) -->
    <circle cx="720" cy="480" r="6" fill="#FAF8F5" filter="url(#y-glow)" />
    <circle cx="720" cy="340" r="5" fill="#D49B35" />
    <circle cx="540" cy="340" r="5" fill="#D49B35" />
    <circle cx="380" cy="280" r="6" fill="#FAF8F5" filter="url(#y-glow)" />
    <circle cx="880" cy="260" r="5" fill="#1C3F35" />
    <circle cx="960" cy="260" r="6" fill="#FAF8F5" filter="url(#y-glow)" />
    <circle cx="340" cy="480" r="5" fill="#D49B35" />
  </g>

  <!-- ==================== HUMAN FIGURES: YOUTH CODERS & CRAFT APPRENTICES ==================== -->
  <g fill="#111113">
    <!-- Figure 1: Young Female Developer / Tech Lead (Center, Typing at Laptop) -->
    <circle cx="610" cy="480" r="9.5" />
    <!-- Modern Braided Crown Hair -->
    <path d="M600 472 C600 464, 620 464, 624 472 C626 480, 620 488, 610 490 Z" fill="#B85D36" />
    <path d="M600 492 C592 508, 585 535, 580 580 L635 580 C632 535, 625 508, 620 492 Z" fill="#1C3F35" stroke="#111113" stroke-width="1.5" />
    <!-- Arms Extended to Keyboard -->
    <path d="M602 510 L645 535 L675 535" stroke="#111113" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M618 510 L655 540 L685 540" stroke="#111113" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Figure 2: Male Youth Student Collaborator (Right, Pointing to Circuit/Screen) -->
    <circle cx="790" cy="470" r="9.5" />
    <path d="M780 482 C772 498, 765 525, 760 575 L815 575 C812 525, 805 498, 800 482 Z" fill="#D49B35" stroke="#111113" stroke-width="1.5" />
    <!-- Gesturing Hand toward Laptop Screen -->
    <path d="M782 500 L745 490 L710 498" stroke="#111113" stroke-width="3.2" stroke-linecap="round" fill="none" />

    <!-- Figure 3: Apprentice Ceramicist & Hardware Maker (Left, Bridging Clay & Robotics) -->
    <circle cx="390" cy="510" r="9" />
    <path d="M380 522 C372 538, 365 565, 360 615 L415 615 C412 565, 405 538, 400 522 Z" fill="#B85D36" stroke="#111113" stroke-width="1.5" />
    <!-- Arm Holding Digital Caliper / Sensor over Clay Pot -->
    <path d="M382 535 L330 540 L300 520" stroke="#111113" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="298" cy="518" r="4" fill="#FAF8F5" filter="url(#y-glow)" />

    <!-- Figure 4: Seated Workshop Mentor / Elder Artisan (Far Right) -->
    <circle cx="980" cy="490" r="10" />
    <path d="M968 504 C958 525, 950 560, 945 615 L1015 615 C1010 560, 1002 525, 995 504 Z" fill="#152F28" stroke="#111113" stroke-width="2" />
  </g>

  <!-- ==================== TYPOGRAPHIC OVERLAY BADGE / ACCENT ==================== -->
  <g transform="translate(60, 60)">
    <rect width="280" height="48" rx="4" fill="#111113" opacity="0.85" />
    <rect width="280" height="48" rx="4" fill="none" stroke="#D49B35" stroke-width="1.2" opacity="0.7" />
    <text x="18" y="24" font-family="system-ui, sans-serif" font-weight="800" font-size="11" letter-spacing="2.5" fill="#D49B35">ACT III: SOLAR CODE &amp; CLAY</text>
    <text x="18" y="39" font-family="system-ui, sans-serif" font-weight="500" font-size="10" letter-spacing="1.2" fill="#FAF8F5">Kwali Pottery &amp; Decentralized STEM Hub</text>
  </g>
</svg>
