<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" role="img" aria-label="Clean Aquifers and Maternal Care: Solar Boreholes and Mobile Clinics in Rural FCT">
  <defs>
    <!-- Sky & Atmospheric Gradients -->
    <linearGradient id="h-sky-grad" x1="600" y1="0" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C3F35" />
      <stop offset="35%" stop-color="#2D5A4C" />
      <stop offset="70%" stop-color="#D49B35" />
      <stop offset="90%" stop-color="#F2DFBC" />
      <stop offset="100%" stop-color="#FAF8F5" />
    </linearGradient>

    <!-- Solar & Water Gradients -->
    <linearGradient id="h-solar-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111113" />
      <stop offset="50%" stop-color="#1C3F35" />
      <stop offset="100%" stop-color="#4A7568" />
    </linearGradient>

    <linearGradient id="h-water-stream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="40%" stop-color="#A5D6C6" />
      <stop offset="80%" stop-color="#1C3F35" />
      <stop offset="100%" stop-color="#0E1E1A" />
    </linearGradient>

    <linearGradient id="h-terra-earth" x1="0" y1="520" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D49B35" />
      <stop offset="25%" stop-color="#B85D36" />
      <stop offset="65%" stop-color="#7A3918" />
      <stop offset="100%" stop-color="#261005" />
    </linearGradient>

    <linearGradient id="h-tent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="60%" stop-color="#E5DFD5" />
      <stop offset="100%" stop-color="#B85D36" />
    </linearGradient>

    <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== SKY & SAVANNAH BACKGROUND ==================== -->
  <rect width="1200" height="800" fill="url(#h-sky-grad)" />

  <!-- Morning Sun Core -->
  <circle cx="880" cy="220" r="160" fill="#D49B35" opacity="0.35" filter="url(#h-glow)" />
  <circle cx="880" cy="220" r="70" fill="#FAF8F5" opacity="0.9" />

  <!-- Distant Rolling Hills of Kuje & Kwali -->
  <path d="M0 420 Q300 370 600 400 Q900 430 1200 380 L1200 520 L0 520 Z" fill="#152F28" opacity="0.85" />
  <path d="M0 460 Q250 420 500 445 Q750 470 1000 435 Q1120 420 1200 450 L1200 560 L0 560 Z" fill="#1C3F35" />

  <!-- Midground Savannah Trees & Foliage -->
  <g fill="#0F241E">
    <ellipse cx="140" cy="460" rx="90" ry="40" />
    <ellipse cx="280" cy="475" rx="70" ry="32" />
    <ellipse cx="980" cy="465" rx="110" ry="45" />
    <ellipse cx="1120" cy="470" rx="80" ry="35" />
  </g>

  <!-- ==================== TERRACOTTA SOIL & AQUIFER GROUND ==================== -->
  <path d="M0 500 C320 480, 640 520, 960 490 C1080 480, 1150 495, 1200 490 L1200 800 L0 800 Z" fill="url(#h-terra-earth)" />

  <!-- Clean Water Retention Basin & Flow Pathways -->
  <path d="M120 800 C160 740, 240 700, 340 680 C440 660, 520 670, 620 655 C680 645, 750 650, 800 635 L820 650 C760 670, 700 665, 630 680 C530 700, 440 700, 360 725 C260 760, 180 780, 100 800 Z" fill="#1C3F35" opacity="0.9" />
  <path d="M160 800 C200 750, 280 720, 370 700 C460 680, 540 690, 630 675 L650 685 C560 705, 480 700, 390 720 C300 750, 220 780, 140 800 Z" fill="#8BB8A8" opacity="0.8" />
  <path d="M220 800 C280 765, 360 740, 440 725 L470 735 C390 755, 310 780, 250 800 Z" fill="#FAF8F5" opacity="0.9" />

  <!-- ==================== STRUCTURE 1: SOLAR-POWERED BOREHOLE (Left/Center) ==================== -->
  <g id="solar-borehole-tower">
    <!-- Elevated Water Tank Tower (Galvanized Steel Truss) -->
    <!-- Steel Legs -->
    <line x1="280" y1="240" x2="240" y2="580" stroke="#111113" stroke-width="4.5" />
    <line x1="380" y1="240" x2="420" y2="580" stroke="#111113" stroke-width="4.5" />
    <line x1="330" y1="240" x2="330" y2="580" stroke="#111113" stroke-width="3" />

    <!-- Truss Cross Bracing -->
    <g stroke="#111113" stroke-width="2.2" opacity="0.85">
      <line x1="272" y1="300" x2="388" y2="300" />
      <line x1="264" y1="380" x2="396" y2="380" />
      <line x1="256" y1="460" x2="404" y2="460" />
      <line x1="248" y1="540" x2="412" y2="540" />

      <line x1="272" y1="300" x2="396" y2="380" />
      <line x1="388" y1="300" x2="264" y2="380" />
      <line x1="264" y1="380" x2="404" y2="460" />
      <line x1="396" y1="380" x2="256" y2="460" />
      <line x1="256" y1="460" x2="412" y2="540" />
      <line x1="404" y1="460" x2="248" y2="540" />
    </g>

    <!-- Elevated High-Capacity Water Storage Tank (Savannah Emerald Cylindrical Tank) -->
    <rect x="270" y="180" width="120" height="70" rx="8" fill="#1C3F35" stroke="#111113" stroke-width="3" />
    <line x1="270" y1="205" x2="390" y2="205" stroke="#D49B35" stroke-width="2.5" />
    <line x1="270" y1="225" x2="390" y2="225" stroke="#FAF8F5" stroke-width="1.5" opacity="0.8" />
    <!-- Community Water Markings -->
    <text x="330" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="9" letter-spacing="1.5" fill="#FAF8F5">ARI WATER BOREHOLE</text>

    <!-- Solar PV Array Mounted on Top / Side of Tower -->
    <g transform="translate(240, 110)">
      <!-- Angled Frame -->
      <polygon points="0,50 180,20 180,55 0,85" fill="url(#h-solar-panel)" stroke="#D49B35" stroke-width="2.5" />
      <!-- Solar Grid Cells -->
      <g stroke="#D49B35" stroke-width="1" opacity="0.75">
        <line x1="45" y1="42" x2="45" y2="77" />
        <line x1="90" y1="35" x2="90" y2="70" />
        <line x1="135" y1="27" x2="135" y2="62" />
        <line x1="0" y1="68" x2="180" y2="38" />
      </g>
      <!-- Solar Glare Flare -->
      <line x1="80" y1="25" x2="140" y2="60" stroke="#FAF8F5" stroke-width="3" stroke-linecap="round" opacity="0.7" filter="url(#h-glow)" />
    </g>

    <!-- Downward Pipe and Tap Outflow Station -->
    <rect x="325" y="250" width="10" height="340" fill="#7A736B" stroke="#111113" stroke-width="1.5" />
    <!-- Brass / Gold Multi-Tap Manifold -->
    <rect x="300" y="580" width="60" height="16" rx="3" fill="#D49B35" stroke="#111113" stroke-width="1.5" />
    <rect x="310" y="596" width="6" height="12" fill="#D49B35" stroke="#111113" stroke-width="1" />
    <rect x="344" y="596" width="6" height="12" fill="#D49B35" stroke="#111113" stroke-width="1" />

    <!-- Pure Water Jet Gushing from Taps into Clay Urns & Steel Jerrycans -->
    <path d="M313 608 Q313 660 305 690" stroke="url(#h-water-stream)" stroke-width="5" stroke-linecap="round" />
    <path d="M347 608 Q347 660 355 690" stroke="url(#h-water-stream)" stroke-width="5" stroke-linecap="round" />

    <!-- Splashing Water Droplets -->
    <circle cx="304" cy="690" r="4" fill="#FAF8F5" filter="url(#h-glow)" />
    <circle cx="356" cy="690" r="4" fill="#FAF8F5" filter="url(#h-glow)" />
    <ellipse cx="330" cy="700" rx="35" ry="10" fill="#FAF8F5" opacity="0.6" />
  </g>

  <!-- Traditional Terracotta Water Vessels & Contemporary Steel Cans -->
  <!-- Clay Pot (Left) -->
  <path d="M285 710 C270 695, 270 660, 290 655 C295 650, 315 650, 320 655 C340 660, 340 695, 325 710 Z" fill="#B85D36" stroke="#111113" stroke-width="2" />
  <ellipse cx="305" cy="655" rx="14" ry="4" fill="#D49B35" stroke="#111113" stroke-width="1.5" />
  <!-- Traditional Clay Pattern -->
  <path d="M282 675 Q305 685 328 675" stroke="#D49B35" stroke-width="2" fill="none" />

  <!-- Jerrycan (Right) -->
  <rect x="345" y="650" width="30" height="42" rx="4" fill="#D49B35" stroke="#111113" stroke-width="2" />
  <rect x="352" y="642" width="16" height="8" rx="2" fill="#111113" />

  <!-- ==================== STRUCTURE 2: MOBILE HEALTH OUTREACH CLINIC (Right side) ==================== -->
  <g id="health-clinic-tent">
    <!-- Clinic Canopy Tent -->
    <!-- Tent Roof -->
    <polygon points="760,400 980,340 1140,410 940,460" fill="url(#h-tent-grad)" stroke="#111113" stroke-width="3" />
    <polygon points="760,400 940,460 940,580 760,530" fill="#FAF8F5" stroke="#111113" stroke-width="2.5" />
    <polygon points="940,460 1140,410 1140,530 940,580" fill="#E5DFD5" stroke="#111113" stroke-width="2.5" />

    <!-- Red Cross / Health Emblem on Tent -->
    <g transform="translate(830, 440)">
      <rect x="15" y="0" width="10" height="40" fill="#B85D36" />
      <rect x="0" y="15" width="40" height="10" fill="#B85D36" />
      <circle cx="20" cy="20" r="28" fill="none" stroke="#B85D36" stroke-width="2" stroke-dasharray="3 2" />
    </g>

    <!-- Clinic Banner -->
    <rect x="780" y="500" width="140" height="24" rx="3" fill="#1C3F35" />
    <text x="850" y="516" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="9" letter-spacing="1.2" fill="#FAF8F5">FCT MATERNAL CLINIC</text>

    <!-- Medical Tent Poles -->
    <line x1="760" y1="400" x2="760" y2="570" stroke="#111113" stroke-width="3.5" />
    <line x1="940" y1="460" x2="940" y2="620" stroke="#111113" stroke-width="3.5" />
    <line x1="1140" y1="410" x2="1140" y2="570" stroke="#111113" stroke-width="3.5" />
  </g>

  <!-- ==================== HUMAN FIGURES: HEALTH WORKERS & MOTHERS ==================== -->
  <g fill="#111113">
    <!-- Figure 1: Health Worker / Nurse in Lab Coat (Standing at Clinic Entry) -->
    <circle cx="910" cy="530" r="9" />
    <path d="M900 542 C895 555, 890 580, 888 625 L932 625 C930 580, 925 555, 920 542 Z" fill="#FAF8F5" stroke="#111113" stroke-width="2" />
    <!-- Stethoscope -->
    <path d="M905 544 Q910 562 915 544" stroke="#1C3F35" stroke-width="2" fill="none" />
    <circle cx="910" cy="564" r="2.5" fill="#D49B35" />

    <!-- Figure 2: Mother Holding Child / Beneficiary (Talking with Doctor) -->
    <circle cx="950" cy="535" r="8.5" />
    <!-- Warm Ochre Headwrap -->
    <path d="M942 530 C942 522, 958 522, 960 530 C962 536, 958 542, 950 544 Z" fill="#D49B35" />
    <!-- Dress Silhouette -->
    <path d="M942 546 C935 560, 925 590, 920 635 L975 635 C972 590, 962 560, 958 546 Z" fill="#B85D36" stroke="#111113" stroke-width="1.5" />
    <!-- Infant / Child in Arms -->
    <circle cx="936" cy="560" r="5" fill="#111113" />
    <ellipse cx="934" cy="572" rx="6" ry="10" fill="#FAF8F5" />

    <!-- Figure 3: Water Beneficiary Woman Carrying Clean Water Urn on Head (Left Foreground) -->
    <circle cx="210" cy="570" r="9" />
    <path d="M200 582 C192 600, 185 635, 180 690 L240 690 C235 635, 228 600, 220 582 Z" fill="#1C3F35" stroke="#111113" stroke-width="1.5" />
    <!-- Water Vessel Balanced on Headwrap -->
    <ellipse cx="210" cy="562" rx="10" ry="3" fill="#B85D36" />
    <path d="M198 558 C190 545, 192 530, 210 528 C228 530, 230 545, 222 558 Z" fill="#D49B35" stroke="#111113" stroke-width="1.5" />
    <!-- Arms Supporting Vessel -->
    <path d="M198 586 L194 550 L202 550" stroke="#111113" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M222 586 L226 550 L218 550" stroke="#111113" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Figure 4: Young Boy Drinking Clean Water from Cup -->
    <circle cx="390" cy="620" r="7.5" />
    <path d="M382 630 C378 642, 375 665, 372 690 L408 690 C405 665, 402 642, 398 630 Z" fill="#D49B35" />
    <path d="M394 635 L402 628 L406 634" stroke="#FAF8F5" stroke-width="2" fill="none" />
  </g>

  <!-- ==================== TYPOGRAPHIC OVERLAY BADGE / ACCENT ==================== -->
  <g transform="translate(60, 60)">
    <rect width="280" height="48" rx="4" fill="#111113" opacity="0.85" />
    <rect width="280" height="48" rx="4" fill="none" stroke="#D49B35" stroke-width="1.2" opacity="0.7" />
    <text x="18" y="24" font-family="system-ui, sans-serif" font-weight="800" font-size="11" letter-spacing="2.5" fill="#D49B35">ACT II: CLEAN AQUIFERS &amp; CARE</text>
    <text x="18" y="39" font-family="system-ui, sans-serif" font-weight="500" font-size="10" letter-spacing="1.2" fill="#FAF8F5">Solar Boreholes &amp; Maternal Diagnostics</text>
  </g>
</svg>
